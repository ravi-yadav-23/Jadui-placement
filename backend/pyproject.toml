[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"
# Legacy modules are linted only once they are rewritten.
extend-exclude = ["modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
