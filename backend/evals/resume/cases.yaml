# Labeled evaluation set for the resume screener. All people and companies are fictional.
# Labels describe what a careful human would extract; run.py compares the pipeline against them.

resumes:
  fresher_strong:
    labels:
      skills: [Python, FastAPI, PostgreSQL, Redis, Docker, React, Git]
      bullets:   # beginnings of bullets that must be extracted
        - Built a FastAPI service for invoice reconciliation
        - Wrote 120 pytest unit tests
        - Developed a Next.js dashboard backed by PostgreSQL
        - Implemented Redis caching that cut page load time
    text: |
      Asha Verma
      asha.verma@example.com | +91 98765 43210 | linkedin.com/in/ashaverma | github.com/ashaverma
      EDUCATION
      B.Tech Computer Science, Example Institute of Technology, 2022 - 2026, CGPA 8.4/10
      EXPERIENCE
      Backend Intern, Acme Payments, Jun 2025 - Aug 2025
      Built a FastAPI service for invoice reconciliation handling 20k requests per day
      Wrote 120 pytest unit tests covering the billing API, raising coverage to 85%
      PROJECTS
      Campus Placement Tracker | Next.js, PostgreSQL, Redis, Docker
      Developed a Next.js dashboard backed by PostgreSQL for 300 students
      Implemented Redis caching that cut page load time by 40%
      SKILLS
      Python, FastAPI, PostgreSQL, Redis, Docker, React, Git

