jds:
  backend_intern:
    labels:
      must_skills: [Python, REST APIs, FastAPI, Django, PostgreSQL, SQL, Docker]
      nice_skills: [Kubernetes, Kafka]
      knockouts: [grad_year, cgpa, location]
    text: |
      Backend Engineering Intern - Example Fintech Pvt Ltd
      Location: Bengaluru (on-site)
      About the role
      You will build and maintain APIs for our payments platform.
      Requirements
      - Strong programming skills in Python
      - Experience building REST APIs with FastAPI or Django
      - Working knowledge of PostgreSQL and SQL query design
      - Familiarity with Docker
      Nice to have
      - Experience with Kubernetes
      - Exposure to message queues such as Kafka
      Eligibility
      - 2026 batch only
      - Minimum CGPA 7.5

  frontend_intern:
    labels:
      must_skills: [React, JavaScript, HTML/CSS]
      nice_skills: [TypeScript, Next.js, Jest]
      knockouts: []
    text: |
      Frontend Developer Intern - PixelCraft Studio (Remote)
      What you'll do: build responsive product pages and reusable UI components.
      Must have
      - Solid JavaScript fundamentals and experience with React
      - Good command of HTML and CSS, including responsive layouts
      Good to have
      - TypeScript
      - Next.js experience
      - Writing unit tests with Jest

  senior_ml:
    labels:
      must_skills: [Python, Machine Learning, PyTorch]
      nice_skills: [Kubernetes, AWS]
      knockouts: []
    text: |
      Senior Machine Learning Engineer - Northwind AI
      We need an engineer to own our model training and deployment platform.
      Requirements
      - 5+ years of experience building production machine learning systems
      - Expert in Python and PyTorch
      - Experience deploying models at scale and mentoring other engineers
      Preferred
      - Kubernetes and AWS experience

# Expected tier for (resume, jd). Accuracy counts "within one tier" as a hit.
pairs:
  - {resume: fresher_strong, jd: backend_intern, tier: good}
  - {resume: fresher_weak, jd: backend_intern, tier: not_a_fit}
  - {resume: frontend_dev, jd: frontend_intern, tier: strong}
  - {resume: data_ml, jd: senior_ml, tier: stretch}
  - {resume: experienced_backend, jd: backend_intern, tier: good}
