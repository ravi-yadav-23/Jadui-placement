name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Eval harnesses run (fake LLM, no API calls)
        run: |
          python -m evals.resume.run --fake --runs 1
          python -m evals.interview.run --fake --runs 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SUPABASE_JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
      DATABASE_BACKEND: memory
      LLM_PROVIDER: fake
      ALLOWED_ORIGINS: '["http://localhost:3100"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend (memory DB, fake LLM)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
          echo "E2E_TOKEN=$(python scripts/mint_test_token.py "$SUPABASE_JWT_SECRET")" >> "$GITHUB_ENV"
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          NEXT_PUBLIC_BACKEND_URL=http://localhost:8000 NEXT_PUBLIC_E2E_ACCESS_TOKEN="$E2E_TOKEN" npm run build
          nohup npx next start -p 3100 > ../frontend.log 2>&1 &
          npx --yes wait-on http-get://localhost:3100 http-get://localhost:8000/health --timeout 60000
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: tail -n 100 backend.log frontend.log
